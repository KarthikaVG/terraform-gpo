name: Terraform GPO Deployment with Report

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false   # Disable default token auth to use PAT instead

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize and Apply Terraform
        shell: powershell
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Download LGPO.exe
        shell: powershell
        run: |
          Write-Host "Downloading LGPO.zip from Microsoft site..."
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/8/5/C/85C25433-A1B0-4FFA-9429-7E023E7DA8D8/LGPO.zip" -OutFile "LGPO.zip"
          Expand-Archive -Path "LGPO.zip" -DestinationPath "$PWD\LGPO"
          Copy-Item -Path "$PWD\LGPO\LGPO.exe" -Destination "$PWD"
          Write-Host "LGPO.exe is now available in working directory."

      - name: Apply GPO from Script
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\apply_gpo.ps1

      - name: Generate GPO Report using GPOZaurr
        shell: powershell
        run: |
          Import-Module GPOZaurr
          $report = Show-GPOZaurr
          $report | Out-HtmlView -FilePath "C:\Temp\GPOAuditReport.html"
          Copy-Item -Path "C:\Temp\GPOAuditReport.html" -Destination ".\GPOAuditReport.html"

      - name: List files after generating report
        shell: powershell
        run: |
          Write-Output "Listing GPOAuditReport.html files in repo:"
          Get-ChildItem -Path . -Filter "GPOAuditReport.html" -Recurse

      - name: Check .gitignore content
        shell: powershell
        run: |
          Write-Output "Contents of .gitignore:"
          if (Test-Path .gitignore) {
            Get-Content .gitignore
          } else {
            Write-Output "No .gitignore file found"
          }

      - name: Check git status before commit
        shell: powershell
        run: |
          git status

      - name: Push GPO Report to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}   # Pass PAT here securely
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/KarthikaVG/terraform-gpo.git
          git add GPOAuditReport.html
          $status = git status --porcelain
          if ($status) {
            git commit -m "Add GPO audit report"
            git push
          } else {
            Write-Output "Nothing to commit or push"
          }
