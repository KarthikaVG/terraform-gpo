name: Terraform GPO Deployment with Report

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize and Apply Terraform
        shell: powershell
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Apply GPO from Script
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\apply_gpo.ps1

      - name: Generate GPO Report using GPOZaurr
        shell: powershell
        run: |
          Import-Module GPOZaurr
          $report = Show-GPOZaurr
          $localPath = "$env:USERPROFILE\Desktop\GPOAuditReport.html"
          $repoPath = "$PWD\GPOAuditReport.html"
          $report | Out-HtmlView -FilePath $localPath
          Copy-Item -Path $localPath -Destination $repoPath -Force
          Write-Host "Report saved to Desktop and copied to repo directory."

      - name: Push GPO Report to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/KarthikaVG/terraform-gpo.git

          git add GPOAuditReport.html
          $status = git status --porcelain
          if ($status) {
            git commit -m "Add GPO audit report"
            git push
          } else {
            Write-Output "Nothing to commit or push"
          }

      - name: Cleanup
        shell: powershell
        run: |
          Remove-Item "$env:USERPROFILE\Desktop\GPOAuditReport.html" -ErrorAction SilentlyContinue
