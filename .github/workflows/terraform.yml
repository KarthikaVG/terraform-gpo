name: Terraform GPO Deployment with Report

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize and Apply Terraform
        shell: powershell
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Generate GPO Report using GPOZaurr
        shell: powershell
        run: |
          Import-Module GPOZaurr
          Show-GPOZaurr | Out-File GPOAuditReport.html -Encoding utf8

      - name: List files in repo to verify report exists
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse | Where-Object { $_.Name -eq 'GPOAuditReport.html' }
          Get-Content -Path .\GPOAuditReport.html -TotalCount 10

      - name: Push GPO Report to GitHub
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/KarthikaVG/terraform-gpo.git
          git add GPOAuditReport.html
          $status = git status --porcelain
          if ($status) {
            git commit -m "Add GPO audit report"
            git push
          } else {
            Write-Output "Nothing to commit or push"
          }
