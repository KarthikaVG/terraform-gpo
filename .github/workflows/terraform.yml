name: Terraform GPO Deployment with Report

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize Terraform
        shell: powershell
        run: terraform init

      - name: Apply Terraform Changes
        shell: powershell
        run: terraform apply -auto-approve

      - name: Generate GPO Report using GPOZaurr
        shell: powershell
        run: |
          Import-Module GPOZaurr
          Show-GPOZaurr | Out-File GPOAuditReport.html -Encoding utf8

      - name: Push Report to GitHub
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:$env:GH_PAT@github.com/KarthikaVG/terraform-gpo.git
          
          if (Test-Path GPOAuditReport.html) {
            git add GPOAuditReport.html
            if (-not (git diff --cached --quiet)) {
              git commit -m "Add GPO audit report"
              git push origin main
            } else {
              Write-Host "No changes to commit."
            }
          } else {
            Write-Host "GPOAuditReport.html not found. Skipping push step."
          }
