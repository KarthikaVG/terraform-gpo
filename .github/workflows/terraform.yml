name: Terraform GPO Deployment with Report

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        shell: powershell
        run: terraform init

      - name: Terraform Apply
        shell: powershell
        run: terraform apply -auto-approve

      - name: Apply GPO Script
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\apply_gpo.ps1

      - name: Generate GPO Report using GPOZaurr
        shell: powershell
        run: |
          Import-Module GPOZaurr
          $report = Show-GPOZaurr
          $localPath = "$env:USERPROFILE\Desktop\GPOAuditReport.html"
          $repoPath = "$PWD\GPOAuditReport.html"
          $report | Out-HtmlView -FilePath $localPath
          Copy-Item -Path $localPath -Destination $repoPath -Force

      - name: Push GPO Report to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/KarthikaVG/terraform-gpo.git
          git add GPOAuditReport.html
          if (git status --porcelain) {
            git commit -m "Add GPO audit report"
            git push
          } else {
            Write-Host "No changes to commit"
          }
